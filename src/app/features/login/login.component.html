<div class="login-container">
  <div class="login-card">

    <div class="login-logo">
      <h1>Acceso Admin</h1>
      <p>Panel privado de Taller Reyes Polo</p>
    </div>

    <div class="field-group">
      <label class="field-label">Usuario</label>
      <input
        type="text"
        placeholder="Ingresa tu usuario"
        [(ngModel)]="usuario"
        data-testid="admin-usuario"
      />
    </div>

    <div class="field-group">
      <label class="field-label" for="admin-password">Contraseña</label>
      <div class="password-field">
        <input
          id="admin-password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          autocomplete="current-password"
          [(ngModel)]="password"
          (keydown.enter)="login()"
          data-testid="admin-password"
        />
        <button class="password-toggle" type="button" (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="showPassword">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
            <path *ngIf="showPassword" d="M3 3 21 21" />
          </svg>
        </button>
      </div>
    </div>

    <a class="recovery-link" routerLink="/recuperar-acceso">¿Olvidaste tu contraseña?</a>

    <button
      class="login-btn"
      (click)="login()"
      data-testid="admin-login"
    >
      Ingresar al panel
    </button>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

    <p class="login-footer">Taller Reyes Polo · Trujillo, La Libertad</p>

  </div>
</div>
